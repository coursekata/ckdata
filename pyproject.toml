[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "ckdata"
dynamic = ["version"]
description = "Read Amazon Athena results through Arrow, with lazy queries and saved Parquet results."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyarrow>=26", "pydantic>=2.12,<3", "tzdata>=2026.1"]
license = "MIT"
license-files = ["LICENSE", "NOTICE", "python/THIRD_PARTY_LICENSES.txt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
]

[project.urls]
Repository = "https://github.com/coursekata/ckdata"
Issues = "https://github.com/coursekata/ckdata/issues"

[project.optional-dependencies]
ibis = ["ibis-framework>=12,<13", "pandas>=2.2,<4", "pyarrow-hotfix>=0.4"]

[tool.maturin]
manifest-path = "python/Cargo.toml"
module-name = "ckdata._native"
python-source = "python"
locked = true
include = [{ path = "rust-notices/**/*", from = "out-dir", to = "ckdata/licenses/" }]

[dependency-groups]
dev = [
    { include-group = "test" },
    "air-formatter>=0.12,<0.14",
    "identify>=2.6,<3",
    "lefthook>=2.2.2,<3",
    "pre-commit-hooks>=6,<7",
    "ruff>=0.17.3,<0.18",
    "rust-just>=1.46,<2",
]
test = ["pytest>=9,<10"]
bindings = [
    { include-group = "test" },
    "maturin>=1.15,<2",
    "pyarrow>=26,<27",
    "polars",
    "pandas",
    "duckdb",
]

[tool.uv]
exclude-newer = "7 days"
# Invalidate native builds when their inputs change, rather than rebuilding on
# every developer command. Pure Python modules remain editable.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "core/Cargo.toml" },
    { file = "core/src/**/*.rs" },
    { file = "core/src/**/*.json" },
    { file = "python/Cargo.toml" },
    { file = "python/src/**/*.rs" },
    { file = "python/build.rs" },
    { file = "python/ckdata/*.py" },
    { file = "python/ckdata/*.json" },
    { file = "README.md" },
    { file = "LICENSE" },
    { file = "NOTICE" },
    { file = "python/THIRD_PARTY_LICENSES.txt" },
    { env = "RUSTFLAGS" },
    { env = "CARGO_BUILD_TARGET" },
    { env = "MACOSX_DEPLOYMENT_TARGET" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
markers = ["live: opt-in AWS acceptance against restricted synthetic fixtures"]

[tool.ruff]
force-exclude = true
extend-exclude = ["**/*[sS][aA][gG][aA]*/**", ".local", "target"]
