default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(python/|r/inst/)(THIRD_PARTY_NOTICES\.txt|RUST_RUNTIME_NOTICES\.html)$|^scripts/licenses/upstream/
      - id: end-of-file-fixer
        exclude: ^(python/|r/inst/)(THIRD_PARTY_NOTICES\.txt|RUST_RUNTIME_NOTICES\.html)$|^scripts/licenses/upstream/
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        # Generated legal texts are verified against the locked dependencies below.
        exclude: ^(python/|r/inst/)(THIRD_PARTY_NOTICES\.txt|RUST_RUNTIME_NOTICES\.html)$

  # Stops a secret from ever entering the history; CI re-checks the full commit graph, because
  # this hook only sees the staged diff and yields to --no-verify.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # -system resolves gitleaks from PATH; upstream omits pass_filenames on this variant only, so
      # the staged paths would otherwise be appended and the first one read as gitleaks' target.
      - id: gitleaks-system
        pass_filenames: false

  - repo: https://github.com/renovatebot/pre-commit-hooks
    rev: 44.206.2
    hooks:
      - id: renovate-config-validator

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: local
    hooks:
      # The R crate is a workspace of its own, so it is formatted on its own.
      - id: rustfmt
        name: rustfmt
        entry: sh -c 'cargo fmt --all --check && cargo fmt --all --check --manifest-path r/src/rust/Cargo.toml'
        language: system
        files: (^|/)(Cargo\.(toml|lock)|[^/]+\.rs)$
        pass_filenames: false

      - id: clippy
        name: clippy
        entry: cargo clippy --workspace --all-targets --locked -- -D warnings
        language: system
        files: (^|/)(Cargo\.(toml|lock)|[^/]+\.rs)$
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: cargo-test
        name: cargo test
        entry: cargo test --workspace --all-targets --locked --exclude ckdata-py
        language: system
        files: (^|/)(Cargo\.(toml|lock)|[^/]+\.rs)$
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: license-notices
        name: locked Cargo license notices
        entry: uv run --locked python -m scripts.check_licenses
        language: system
        files: (^|/)(Cargo\.(toml|lock)|LICENSE)$|^scripts/(check_licenses\.py|licenses/)|^(python/|r/inst/)(THIRD_PARTY_NOTICES\.txt|RUST_RUNTIME_NOTICES\.html)$
        pass_filenames: false
        stages: [pre-push]

      - id: cargo-test-r
        name: cargo test (R native bridge)
        entry: Rscript -e 'Sys.setenv(R_INCLUDE_DIR = R.home("include")); quit(status = system2("cargo", c("test", "--manifest-path", "r/src/rust/Cargo.toml", "--all-targets", "--locked")))'
        language: system
        files: (^|/)(Cargo\.(toml|lock)|[^/]+\.rs)$
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: pytest
        name: Python tests
        entry: uv run --locked --group bindings --all-packages pytest tests python/tests
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
