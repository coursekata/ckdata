[package]
name = "ckdata-py"
description = "Python interface to ckdata's shared Athena reader"
repository = "https://github.com/coursekata/ckdata"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[lib]
name = "ckdata_py"
crate-type = ["cdylib"]

[dependencies]
ckdata = { path = "../core" }
arrow-array = "60"
pyo3 = { version = "0.30", features = ["abi3-py311"] }
pyo3-arrow = "0.21"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
