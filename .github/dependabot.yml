# Action SHAs only; Renovate tracks supported registries. Manual CRAN and
# upstream-constrained reviews are recorded in dependency-policy.md.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # The org's seven-day soak, which Renovate applies to everything else.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
