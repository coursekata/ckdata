name: ci

# The pull request gate. quality runs the org's secret and CVE scans, hooks this repository's own
# hooks, and rust the core and the Python binding. r-source builds the R source tarball once on
# Linux and r checks that tarball on each system, as R-universe builds every binary from it; a
# Windows checkout would turn the core's symlink into a text file. ci-passed is the one check the
# main branch ruleset requires.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: coursekata/ck-ci/.github/workflows/quality.yml@v0.2.1

  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install rustfmt
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        env:
          # quality scans the whole history for secrets.
          SKIP: gitleaks-system
        with:
          prek-version: "0.5.9"
          extra-args: --all-files

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install clippy
        run: rustup toolchain install stable --profile minimal --component clippy

      # Lints the Python binding too.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The binding has no Rust tests, and its test binary would need libpython to link.
      - run: cargo test --workspace --locked --exclude ckdata-py

  r-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true

      - name: Build the source tarball
        run: R CMD build r

      - name: Check the tarball carries the core
        run: scripts/check-r-tarball.sh ckdata_*.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r-source
          path: ckdata_*.tar.gz
          if-no-files-found: error
          retention-days: 1

  r:
    name: r (${{ matrix.os }}, R ${{ matrix.r }})
    needs: r-source
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, r: release }
          - { os: ubuntu-latest, r: oldrel-1 }
          - { os: macos-latest, r: release }
          - { os: windows-latest, r: release }
    steps:
      # For the DESCRIPTION the dependency step reads; the check itself runs on the tarball.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: r-source

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
          needs: check

      # Rtools links R packages with the GNU toolchain, which the Windows build targets.
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          if [ "$RUNNER_OS" = Windows ]; then rustup target add x86_64-pc-windows-gnu; fi

      - name: Check the source tarball
        shell: Rscript {0}
        run: |
          tarball <- Sys.glob("ckdata_*.tar.gz")
          rcmdcheck::rcmdcheck(tarball, args = "--no-manual", error_on = "warning", check_dir = "check")

  # A job skipped because one it needs failed reports skipped, which a required check accepts, so
  # this asserts success itself.
  ci-passed:
    if: always()
    needs: [quality, hooks, rust, r-source, r]
    runs-on: ubuntu-latest
    steps:
      - name: Assert every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
