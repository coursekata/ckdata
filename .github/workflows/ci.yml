name: ci

# The pull request gate. quality runs the org's secret and CVE scans, hooks this repository's own
# hooks, and rust the core and the Python binding. r-source builds the R source tarball once on
# Linux and r checks that tarball on each system, as R-universe builds every binary from it; a
# Windows checkout would turn the core's symlink into a text file. ci-passed is the one check the
# main branch ruleset requires.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: coursekata/ck-ci/.github/workflows/quality.yml@7b7d7a59556b4c15d4f15c9d6fd2723419a5dd19 # v0.2.1

  hooks:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install rustfmt
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Run fast Python tests
        env:
          AWS_CONFIG_FILE: /dev/null
          AWS_SHARED_CREDENTIALS_FILE: /dev/null
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          uv run --locked pytest tests/unit

      - uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        env:
          # quality scans the whole history for secrets.
          SKIP: gitleaks-system
        with:
          prek-version: "0.5.9"
          extra-args: --all-files

      - name: Capture the existing Renovate validator dependency graph
        run: |
          mkdir -p "$RUNNER_TEMP/npm-inventory"
          touch "$RUNNER_TEMP/npm-inventory/user.npmrc" "$RUNNER_TEMP/npm-inventory/global.npmrc"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npm-inventory/user.npmrc"
          export NPM_CONFIG_GLOBALCONFIG="$RUNNER_TEMP/npm-inventory/global.npmrc"
          export NPM_CONFIG_CACHE="$RUNNER_TEMP/npm-inventory/cache"
          npm_root=$(prek exec renovate-config-validator -- npm root --global)
          set +e
          prek exec renovate-config-validator -- npm ls --all --json --prefix "$npm_root/renovate" \
            > "$RUNNER_TEMP/renovate-tree.json"
          status=$?
          set -e
          # The report retains ELSPROBLEMS and every existing version. Other failures are fatal.
          if [ "$status" -gt 1 ]; then exit "$status"; fi
      - name: Retain informational Rust and complete Node tooling advisories
        run: |
          uv run --locked python -m scripts.audit_dependencies scan \
            --npm-tree "$RUNNER_TEMP/renovate-tree.json" \
            --output "$RUNNER_TEMP/dependency-osv-npm.json" \
            --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-osv-npm-inventory
          path: |
            ${{ runner.temp }}/dependency-osv-npm.json
            ${{ runner.temp }}/renovate-tree.json
          if-no-files-found: error
          retention-days: 30

  rust:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install clippy
        id: toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          toolchain_key=$({ rustc -vV; printf '%s\n' "${ImageOS:-}" "${ImageVersion:-}"; } | sha256sum | cut -d ' ' -f 1)
          echo "key=$toolchain_key" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo downloads and workspace builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'core/Cargo.toml', 'python/Cargo.toml') }}

      # Lints the Python binding too.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The binding has no Rust tests, and its test binary would need libpython to link.
      - run: cargo test --workspace --all-targets --locked --exclude ckdata-py

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
      - name: Test the compiled Python binding
        run: uv run --locked --group bindings --all-packages pytest python/tests

      - name: Verify locked Cargo license notices
        run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path r/src/rust/Cargo.toml
          python3 scripts/check_licenses.py

  rust-minimum:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install R for the binding check
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: release
          use-public-rspm: true
      - name: Install the declared minimum Rust version
        id: minimum
        run: |
          minimum=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' core/Cargo.toml)
          rustup toolchain install "$minimum" --profile minimal
          echo "version=$minimum" >> "$GITHUB_OUTPUT"
          toolchain_key=$({ rustc +"$minimum" -vV; printf '%s\n' "${ImageOS:-}" "${ImageVersion:-}"; } | sha256sum | cut -d ' ' -f 1)
          echo "key=$toolchain_key" >> "$GITHUB_OUTPUT"
      - name: Cache the minimum toolchain build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-msrv-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.minimum.outputs.key }}-${{ hashFiles('Cargo.lock', 'r/src/rust/Cargo.lock', 'core/Cargo.toml', 'python/Cargo.toml', 'r/src/rust/Cargo.toml') }}
      - name: Check the root workspace at the declared minimum
        env:
          MINIMUM_RUST: ${{ steps.minimum.outputs.version }}
        run: cargo +"$MINIMUM_RUST" check --workspace --all-targets --locked

      - name: Test the R native bridge at the declared minimum
        shell: Rscript {0}
        env:
          MINIMUM_RUST: ${{ steps.minimum.outputs.version }}
        run: |
          Sys.setenv(R_INCLUDE_DIR = R.home("include"))
          status <- system2("cargo", c(paste0("+", Sys.getenv("MINIMUM_RUST")),
            "test", "--manifest-path", "r/src/rust/Cargo.toml", "--all-targets", "--locked"))
          quit(status = status)

  dependency-inventory:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        env:
          TRIVY_VERSION: v0.76.1
        with:
          version: ${{ env.TRIVY_VERSION }}
      - name: Export every development lock record for scanning
        run: python3 -m scripts.audit_dependencies export --output "$RUNNER_TEMP/dependency-inventory"
      - name: Inventory all severities, including unfixed advisories
        run: |
          trivy fs --scanners vuln --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --include-dev-deps --ignore-unfixed=false --ignorefile '' --config '' \
            --list-all-pkgs --show-suppressed --exit-code 0 --no-progress \
            --format json --output "$RUNNER_TEMP/dependency-inventory.json" \
            "$RUNNER_TEMP/dependency-inventory"
          python3 -m scripts.audit_dependencies verify "$RUNNER_TEMP/dependency-inventory.json"
          {
            echo '### Dependency advisory inventory'
            echo 'Fixed HIGH/CRITICAL findings fail this job. The retained inventory includes every severity and unfixed finding.'
            jq -r '.Results[] | .Vulnerabilities[]? | "- \(.Severity): \(.PkgName) \(.InstalledVersion), \(.VulnerabilityID), fix: \(.FixedVersion // "unreleased")"' "$RUNNER_TEMP/dependency-inventory.json"
          } >> "$GITHUB_STEP_SUMMARY"
          trivy fs --scanners vuln --severity HIGH,CRITICAL --include-dev-deps \
            --ignore-unfixed --ignorefile '' --config '' --exit-code 1 --no-progress \
            "$RUNNER_TEMP/dependency-inventory"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-advisory-inventory
          path: ${{ runner.temp }}/dependency-inventory.json
          if-no-files-found: error
          retention-days: 30

  r-source:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true

      - name: Install Rust for build integration tests
        run: rustup toolchain install stable --profile minimal

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Run R build integration tests
        run: uv run --locked pytest tests/integration

      - name: Build the source tarball
        run: R CMD build r

      - name: Check the tarball carries the core
        run: python3 -m scripts.check_r_tarball ckdata_*.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r-source
          path: ckdata_*.tar.gz
          if-no-files-found: error
          retention-days: 1

  r:
    name: r (${{ matrix.os }}, R ${{ matrix.r }})
    # Fail the inexpensive checks before starting native R builds.
    needs: [quality, hooks, rust, rust-minimum, dependency-inventory, r-source]
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, r: release }
          - { os: ubuntu-latest, r: oldrel-1 }
          - { os: ubuntu-latest, r: "4.2" }
          - { os: macos-latest, r: release }
          - { os: windows-latest, r: release }
    steps:
      # For the DESCRIPTION the dependency step reads; the check itself runs on the tarball.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: r-source

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
          needs: check

      # Rtools links R packages with the GNU toolchain, which the Windows build targets.
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          if [ "$RUNNER_OS" = Windows ]; then rustup target add x86_64-pc-windows-gnu; fi

      - name: Configure persistent Cargo paths and cache identity
        id: cargo
        shell: Rscript {0}
        run: |
          cache <- file.path(Sys.getenv("RUNNER_TEMP"), "ckdata-cargo")
          dir.create(cache, recursive = TRUE, showWarnings = FALSE)
          cache <- normalizePath(cache, winslash = "/", mustWork = TRUE)
          paths <- c(CARGO_HOME = file.path(cache, "home"), CARGO_TARGET_DIR = file.path(cache, "target"))
          cat(paste(names(paths), paths, sep = "="), file = Sys.getenv("GITHUB_ENV"), sep = "\n", append = TRUE)
          identity <- tempfile()
          writeLines(c(system2("rustc", "-vV", stdout = TRUE), R.version.string, R.version$platform,
            Sys.getenv(c("ImageOS", "ImageVersion", "MACOSX_DEPLOYMENT_TARGET", "RUSTFLAGS"))), identity)
          cat(paste0("key=", unname(tools::md5sum(identity))), file = Sys.getenv("GITHUB_OUTPUT"), sep = "\n", append = TRUE)

      - name: Cache R's Cargo downloads and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/ckdata-cargo/home/registry
            ${{ runner.temp }}/ckdata-cargo/home/git
            ${{ runner.temp }}/ckdata-cargo/target
          key: cargo-r-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.cargo.outputs.key }}-${{ hashFiles('r/src/rust/Cargo.lock', 'r/src/rust/Cargo.toml', 'core/Cargo.toml', 'r/src/Makevars*.in', 'r/tools/config.R') }}

      - name: Check the source tarball
        shell: Rscript {0}
        run: |
          tarball <- Sys.glob("ckdata_*.tar.gz")
          rcmdcheck::rcmdcheck(tarball, args = "--no-manual", error_on = "warning", check_dir = "check")

  # A job skipped because one it needs failed reports skipped, which a required check accepts, so
  # this asserts success itself.
  ci-passed:
    if: always()
    needs: [quality, hooks, rust, rust-minimum, dependency-inventory, r-source, r]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Assert every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
