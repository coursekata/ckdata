name: ci

# The pull request gate. quality runs the org's secret and CVE scans, hooks this repository's own
# hooks, and rust the core and the Python binding. r-source builds the R source tarball once on
# Linux and r checks that tarball on each system, as R-universe builds every binary from it; a
# Windows checkout would turn the core's symlink into a text file. ci-passed is the one check the
# main branch ruleset requires.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rebuild: ${{ steps.paths.outputs.rebuild }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identify changes that require builds
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          rebuild=true
          # Manual runs and unavailable base commits fall back to the full suite.
          if [[ -n "$BASE_SHA" ]] && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null &&
            git diff --quiet --no-renames "$BASE_SHA" "$GITHUB_SHA" -- . \
              ':(top,exclude,glob,icase)**/*.md' \
              ':(top,exclude,glob)docs/**' \
              ':!**/*[sS][aA][gG][aA]*/**' ':!**/*[sS][aA][gG][aA]*'; then
            rebuild=false
          fi
          echo "rebuild=$rebuild" >> "$GITHUB_OUTPUT"

  quality:
    uses: coursekata/ck-ci/.github/workflows/quality.yml@7b7d7a59556b4c15d4f15c9d6fd2723419a5dd19 # v0.2.1

  hooks:
    needs: changes
    if: needs.changes.outputs.rebuild == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install rustfmt
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Run fast Python tests
        env:
          AWS_CONFIG_FILE: /dev/null
          AWS_SHARED_CREDENTIALS_FILE: /dev/null
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          uv run --locked --only-group dev pytest tests/unit

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: .github/package-lock.json

      - name: Install repository checkers
        env:
          # renovate: datasource=github-releases depName=rhysd/actionlint
          ACTIONLINT_VERSION: v1.7.12
        run: |
          uv sync --locked --only-group dev
          uv run --locked --only-group dev just _setup-repository-tools
          go install github.com/rhysd/actionlint/cmd/actionlint@"$ACTIONLINT_VERSION"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          cargo fetch --locked
          cargo fetch --locked --manifest-path r/src/rust/Cargo.toml

      - name: Check formatting and repository tooling
        run: |
          uv run --locked --only-group dev just fmt --check
          uv run --locked --only-group dev just lint --target python
          uv run --locked --only-group dev just lint --target repo

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          packages: |
            any::lintr
            any::jsonlite
          cache: always
          install-pandoc: false
          install-quarto: false
      - name: Check R static analysis
        run: uv run --locked --only-group dev just lint --target r

      - name: Install OSV-Scanner
        env:
          # renovate: datasource=github-releases depName=google/osv-scanner
          OSV_VERSION: v2.7.0
        run: |
          base="https://github.com/google/osv-scanner/releases/download/$OSV_VERSION"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/osv-scanner_linux_amd64"
          curl -fsSLO "$base/osv-scanner_SHA256SUMS"
          grep ' osv-scanner_linux_amd64$' osv-scanner_SHA256SUMS | sha256sum -c -
          mv osv-scanner_linux_amd64 osv-scanner
          chmod +x osv-scanner

      - name: Audit the lockfiles and installed Renovate validator
        run: |
          mkdir -p "$RUNNER_TEMP/npm-inventory"
          touch "$RUNNER_TEMP/npm-inventory/user.npmrc" "$RUNNER_TEMP/npm-inventory/global.npmrc"
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npm-inventory/user.npmrc"
          export NPM_CONFIG_GLOBALCONFIG="$RUNNER_TEMP/npm-inventory/global.npmrc"
          export NPM_CONFIG_CACHE="$RUNNER_TEMP/npm-inventory/cache"
          set +e
          npm ls --all --json --prefix .github \
            > "$RUNNER_TEMP/renovate-tree.json"
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          set +e
          "$RUNNER_TEMP/osv-scanner" scan source \
            --lockfile Cargo.lock --lockfile r/src/rust/Cargo.lock --lockfile uv.lock \
            --lockfile .github/package-lock.json \
            --no-call-analysis rust --no-resolve --all-packages --all-vulns \
            --x-no-default-plugins --x-plugins rust/cargolock,python/uvlock,javascript/packagelockjson,javascript/packagejson \
            --recursive --no-ignore \
            --x-exclude 'g:**/*[sS][aA][gG][aA]*' \
            --format json --output-file "$RUNNER_TEMP/dependency-osv-npm.json" \
            .github/node_modules
          status=$?
          set -e
          # OSV uses 1 for findings; the full inventory is retained for review.
          # Trivy gates fixed HIGH/CRITICAL findings in dependency-inventory.
          if [ "$status" -gt 1 ]; then exit "$status"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-osv-npm-inventory
          path: |
            ${{ runner.temp }}/dependency-osv-npm.json
            ${{ runner.temp }}/renovate-tree.json
          if-no-files-found: error
          retention-days: 30

  rust:
    needs: changes
    if: needs.changes.outputs.rebuild == 'true'
    name: rust (${{ matrix.task }})
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { task: lint, recipe: lint, target: rust, profile: dev }
          - { task: core, recipe: test, target: rust, profile: dev }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        if: matrix.task == 'lint'
        with:
          use-public-rspm: true
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install Clippy
        if: matrix.task == 'lint'
        run: rustup component add clippy
      - name: Identify the native build environment
        id: toolchain
        env:
          NATIVE_TASK: ${{ matrix.task }}
        run: |
          toolchain_key=$({
            rustc -vV
            printf '%s\n' "${ImageOS:-}" "${ImageVersion:-}" "${RUSTFLAGS:-}" "${CARGO_BUILD_TARGET:-}"
            if [ "$NATIVE_TASK" = lint ]; then Rscript --vanilla -e 'cat(R.version.string, R.version[["platform"]], sep = "\n")'; fi
          } | sha256sum | cut -d ' ' -f 1)
          echo "key=$toolchain_key" >> "$GITHUB_OUTPUT"

      - name: Restore Cargo downloads and workspace builds
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.task }}-${{ matrix.profile }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'core/Cargo.toml', 'python/Cargo.toml', 'r/src/rust/Cargo.lock', 'r/src/rust/Cargo.toml', 'pyproject.toml', 'uv.lock') }}-${{ hashFiles('core/**/*.rs', 'core/**/*.json', 'python/**/*.rs', 'python/**/*.py', 'r/src/rust/**/*.rs', 'justfile', '!**/*[sS][aA][gG][aA]*', '!**/*[sS][aA][gG][aA]*/**', '!**/.local/**', '!**/.aws/**', '!**/target/**', '!**/.venv/**', '!**/node_modules/**') }}
          restore-keys: cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.task }}-${{ matrix.profile }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'core/Cargo.toml', 'python/Cargo.toml', 'r/src/rust/Cargo.lock', 'r/src/rust/Cargo.toml', 'pyproject.toml', 'uv.lock') }}-

      - name: Run ${{ matrix.task }} checks
        env:
          NATIVE_RECIPE: ${{ matrix.recipe }}
          NATIVE_TARGET: ${{ matrix.target }}
        run: uv run --locked --only-group dev just "$NATIVE_RECIPE" --target "$NATIVE_TARGET"

      - name: Check for Cargo cache data
        id: cache-data
        if: ${{ (success() || failure()) && steps.cache.outputs.cache-primary-key != '' && steps.cache.outputs.cache-hit != 'true' }}
        run: |
          if [ -d "$HOME/.cargo/registry" ] || [ -d "$HOME/.cargo/git" ] || [ -d target ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save Cargo downloads and workspace builds
        if: ${{ (success() || failure()) && steps.cache-data.outputs.exists == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  python:
    needs: changes
    if: needs.changes.outputs.rebuild == 'true'
    name: python wheel (${{ matrix.target }})
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: macos-15, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-2025, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
      - name: Install Rust
        shell: bash
        run: rustup toolchain install stable --profile minimal
      - name: Identify the wheel toolchain
        id: toolchain
        shell: bash
        run: |
          key=$({ rustc -vV; printf '%s\n' "${ImageOS:-}" "${ImageVersion:-}" "${RUSTFLAGS:-}"; } | uv run --no-project python -c 'import hashlib, sys; print(hashlib.sha256(sys.stdin.buffer.read()).hexdigest())')
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Restore Python Cargo downloads and builds
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-python-v1-${{ matrix.target }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'core/Cargo.toml', 'python/Cargo.toml') }}-${{ hashFiles('core/**/*.rs', 'core/**/*.json', 'python/**/*.rs', '!**/*[sS][aA][gG][aA]*', '!**/*[sS][aA][gG][aA]*/**', '!**/.local/**', '!**/.aws/**', '!**/target/**', '!**/.venv/**', '!**/node_modules/**') }}
          restore-keys: cargo-python-v1-${{ matrix.target }}-${{ steps.toolchain.outputs.key }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'core/Cargo.toml', 'python/Cargo.toml') }}-
      - name: Build the native wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          maturin-version: "1.15.0"
          rust-toolchain: stable
          target: ${{ matrix.target }}
          manylinux: "2_28"
          before-script-linux: command -v cmake >/dev/null || dnf install -y cmake
          args: --release --locked --sdist --out dist
      - name: Test the installed wheel on Python 3.11 and 3.15
        shell: bash
        run: |
          uv run --locked --only-group dev just _check-wheel 3.11
          uv run --locked --only-group dev just _check-wheel 3.15
      - name: Retain wheel artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30
      - name: Check for Python Cargo cache data
        id: cache-data
        if: ${{ (success() || failure()) && steps.cache.outputs.cache-primary-key != '' && steps.cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          if [ -d "$HOME/.cargo/registry" ] || [ -d "$HOME/.cargo/git" ] || [ -d target ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save Python Cargo downloads and builds
        if: ${{ (success() || failure()) && steps.cache-data.outputs.exists == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  rust-minimum:
    needs: changes
    if: needs.changes.outputs.rebuild == 'true'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install R for the binding check
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: release
          use-public-rspm: true
      - name: Install the declared minimum Rust version
        id: minimum
        run: |
          minimum=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' core/Cargo.toml)
          rustup toolchain install "$minimum" --profile minimal
          echo "version=$minimum" >> "$GITHUB_OUTPUT"
          toolchain_key=$({ rustc +"$minimum" -vV; Rscript --vanilla -e 'cat(R.version.string, R.version[["platform"]], sep = "\n")'; printf '%s\n' "${ImageOS:-}" "${ImageVersion:-}" "${RUSTFLAGS:-}" "${CARGO_BUILD_TARGET:-}"; } | sha256sum | cut -d ' ' -f 1)
          echo "key=$toolchain_key" >> "$GITHUB_OUTPUT"
      - name: Restore the minimum toolchain build
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-msrv-v2-${{ runner.os }}-${{ runner.arch }}-dev-${{ steps.minimum.outputs.key }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'r/src/rust/Cargo.lock', 'core/Cargo.toml', 'python/Cargo.toml', 'r/src/rust/Cargo.toml') }}-${{ hashFiles('core/**/*.rs', 'core/**/*.json', 'python/**/*.rs', 'r/src/rust/**/*.rs', '!**/*[sS][aA][gG][aA]*', '!**/*[sS][aA][gG][aA]*/**', '!**/.local/**', '!**/.aws/**', '!**/target/**', '!**/.venv/**', '!**/node_modules/**') }}
          restore-keys: cargo-msrv-v2-${{ runner.os }}-${{ runner.arch }}-dev-${{ steps.minimum.outputs.key }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'r/src/rust/Cargo.lock', 'core/Cargo.toml', 'python/Cargo.toml', 'r/src/rust/Cargo.toml') }}-
      - name: Check the root workspace at the declared minimum
        env:
          MINIMUM_RUST: ${{ steps.minimum.outputs.version }}
        run: cargo +"$MINIMUM_RUST" check --workspace --all-targets --locked

      - name: Test the R native bridge at the declared minimum
        shell: Rscript {0}
        env:
          MINIMUM_RUST: ${{ steps.minimum.outputs.version }}
        run: |
          Sys.setenv(R_INCLUDE_DIR = R.home("include"))
          status <- system2("cargo", c(paste0("+", Sys.getenv("MINIMUM_RUST")),
            "test", "--manifest-path", "r/src/rust/Cargo.toml", "--all-targets", "--locked"))
          quit(status = status)

      - name: Check for Cargo cache data
        id: cache-data
        if: ${{ (success() || failure()) && steps.cache.outputs.cache-primary-key != '' && steps.cache.outputs.cache-hit != 'true' }}
        run: |
          if [ -d "$HOME/.cargo/registry" ] || [ -d "$HOME/.cargo/git" ] || [ -d target ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save the minimum toolchain build
        if: ${{ (success() || failure()) && steps.cache-data.outputs.exists == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  dependency-inventory:
    needs: changes
    if: needs.changes.outputs.rebuild == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        env:
          TRIVY_VERSION: v0.76.1
        with:
          version: ${{ env.TRIVY_VERSION }}
      - name: Inventory all severities, including unfixed advisories
        run: |
          mkdir -p "$RUNNER_TEMP/dependency-inventory"
          for lock in Cargo.lock r/src/rust/Cargo.lock uv.lock .github/package-lock.json; do
            trivy fs --scanners vuln --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
              --include-dev-deps --ignore-unfixed=false --ignorefile '' --config '' \
              --list-all-pkgs --show-suppressed --exit-code 0 --no-progress \
              --format json --output "$RUNNER_TEMP/dependency-inventory/${lock//\//-}.json" \
              "$lock"
          done
      - name: Gate fixed HIGH and CRITICAL findings
        run: |
          for lock in Cargo.lock r/src/rust/Cargo.lock uv.lock .github/package-lock.json; do
            trivy fs --scanners vuln --severity HIGH,CRITICAL --include-dev-deps \
              --ignore-unfixed --ignorefile '' --config '' --exit-code 1 --no-progress "$lock"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dependency-advisory-inventory
          path: ${{ runner.temp }}/dependency-inventory/*.json
          if-no-files-found: error
          retention-days: 30

  r-source:
    needs: changes
    if: needs.changes.outputs.rebuild == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          use-public-rspm: true

      - name: Build the source tarball
        run: R CMD build r

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r-source
          path: ckdata_*.tar.gz
          if-no-files-found: error
          retention-days: 1

  r:
    name: r (${{ matrix.os }}, R ${{ matrix.r }})
    needs: [r-source]
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, r: release }
          - { os: ubuntu-latest, r: oldrel-1 }
          - { os: ubuntu-latest, r: "4.2" }
          - { os: macos-latest, r: release }
          - { os: windows-latest, r: release }
    steps:
      # For the DESCRIPTION the dependency step reads; the check itself runs on the tarball.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: r-source

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
          needs: check
          cache: always
          install-quarto: false

      # Rtools links R packages with the GNU toolchain, which the Windows build targets.
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          if [ "$RUNNER_OS" = Windows ]; then rustup target add x86_64-pc-windows-gnu; fi

      - name: Configure persistent Cargo paths and cache identity
        id: cargo
        shell: Rscript {0}
        run: |
          cache <- file.path(Sys.getenv("RUNNER_TEMP"), "ckdata-cargo")
          dir.create(cache, recursive = TRUE, showWarnings = FALSE)
          cache <- normalizePath(cache, winslash = "/", mustWork = TRUE)
          paths <- c(CARGO_HOME = file.path(cache, "home"), CARGO_TARGET_DIR = file.path(cache, "target"))
          cat(paste(names(paths), paths, sep = "="), file = Sys.getenv("GITHUB_ENV"), sep = "\n", append = TRUE)
          identity <- tempfile()
          target <- if (.Platform$OS.type == "windows") {
            paste0(if (.Machine$sizeof.pointer == 8L) "x86_64" else "i686", "-pc-windows-gnu")
          } else "host"
          writeLines(c(system2("rustc", "-vV", stdout = TRUE), R.version.string, R.version$platform,
            target, "release", Sys.getenv(c("ImageOS", "ImageVersion", "MACOSX_DEPLOYMENT_TARGET", "RUSTFLAGS", "CARGO_BUILD_TARGET"))), identity)
          cat(paste0("key=", unname(tools::md5sum(identity))), file = Sys.getenv("GITHUB_OUTPUT"), sep = "\n", append = TRUE)

      - name: Restore R's Cargo downloads and builds
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/ckdata-cargo/home/registry
            ${{ runner.temp }}/ckdata-cargo/home/git
            ${{ runner.temp }}/ckdata-cargo/target
          key: cargo-r-v2-${{ runner.os }}-${{ runner.arch }}-release-${{ steps.cargo.outputs.key }}-${{ hashFiles('r/src/rust/Cargo.lock', 'r/src/rust/Cargo.toml', 'core/Cargo.toml', 'r/src/Makevars*.in', 'r/src/Makevars.common', 'r/tools/config.R') }}-${{ hashFiles('core/**/*.rs', 'r/src/**/*.rs', 'r/src/**/*.c', 'r/src/**/*.h', '!**/*[sS][aA][gG][aA]*', '!**/*[sS][aA][gG][aA]*/**', '!**/.local/**', '!**/.aws/**', '!**/target/**', '!**/.venv/**', '!**/node_modules/**') }}
          restore-keys: cargo-r-v2-${{ runner.os }}-${{ runner.arch }}-release-${{ steps.cargo.outputs.key }}-${{ hashFiles('r/src/rust/Cargo.lock', 'r/src/rust/Cargo.toml', 'core/Cargo.toml', 'r/src/Makevars*.in', 'r/src/Makevars.common', 'r/tools/config.R') }}-

      - name: Check the source tarball
        shell: Rscript {0}
        run: |
          tarball <- Sys.glob("ckdata_*.tar.gz")
          rcmdcheck::rcmdcheck(tarball, args = "--no-manual", error_on = "warning", check_dir = "check")

      - name: Check for R Cargo cache data
        id: cache-data
        if: ${{ (success() || failure()) && steps.cache.outputs.cache-primary-key != '' && steps.cache.outputs.cache-hit != 'true' }}
        shell: Rscript {0}
        run: |
          paths <- file.path(Sys.getenv("RUNNER_TEMP"), "ckdata-cargo", c("home/registry", "home/git", "target"))
          if (any(dir.exists(paths))) {
            cat("exists=true\n", file = Sys.getenv("GITHUB_OUTPUT"), append = TRUE)
          }
      - name: Save R's Cargo downloads and builds
        if: ${{ (success() || failure()) && steps.cache-data.outputs.exists == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/ckdata-cargo/home/registry
            ${{ runner.temp }}/ckdata-cargo/home/git
            ${{ runner.temp }}/ckdata-cargo/target
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # The required check runs for every PR. Only the path filter can permit skipped builds.
  ci-passed:
    if: always()
    needs: [changes, quality, hooks, rust, python, rust-minimum, dependency-inventory, r-source, r]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Assert the expected jobs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '
            .changes.outputs.rebuild as $rebuild
            | (.changes.result == "success")
            and (.quality.result == "success")
            and ($rebuild == "true" or $rebuild == "false")
            and all(
              to_entries[] | select(.key != "changes" and .key != "quality");
              .value.result == (if $rebuild == "true" then "success" else "skipped" end)
            )
          ' > /dev/null
