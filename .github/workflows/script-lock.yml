name: script-lock

# PEP 723 updates inline requirements; Renovate does not refresh script locks.
# Keep the lock review on the shared monthly cadence with a seven-day release wait.
on:
  schedule:
    - cron: "31 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: query-script-lock
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Refresh the independent query oracle lock
        env:
          AWS_CONFIG_FILE: /dev/null
          AWS_SHARED_CREDENTIALS_FILE: /dev/null
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          uv lock --script scripts/query-integration/check.py --upgrade --exclude-newer '7 days' --no-build
          uv run --locked scripts/query-integration/check.py --self-test
      - name: Propose a lock update for review
        run: |
          lock=scripts/query-integration/check.py.lock
          if git diff --quiet -- "$lock"; then exit 0; fi
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --search 'in:title "chore(deps): refresh query script lock"' --json url --jq '.[0].url // empty')
          if [ -n "$existing" ]; then
            echo "An existing lock update awaits review: $existing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="chore/query-script-lock-$GITHUB_RUN_ID"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$lock"
          git commit -m 'chore(deps): refresh query script lock'
          gh auth setup-git
          git push origin "HEAD:refs/heads/$branch"
          cat > "$RUNNER_TEMP/lock-pr-body" <<'BODY'
          Refresh the independently checked query harness dependencies within their declared ranges. Packages must have been available for at least seven days; the offline fake-service acceptance checks passed.

          Run the `ci` workflow manually on this branch before merging: pull requests opened with the workflow token do not trigger CI. Review the dependency advisory inventory, including low and unfixed findings.
          BODY
          gh pr create --repo "$GITHUB_REPOSITORY" --head "$branch" --base "$GITHUB_REPOSITORY_DEFAULT_BRANCH" \
            --title 'chore(deps): refresh query script lock' --body-file "$RUNNER_TEMP/lock-pr-body"
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
