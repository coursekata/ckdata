name: verify-release

# Installs a release the way a researcher would, on a machine with no Rust, once R-universe has
# built it, and runs the package's tests against it. R-universe builds outside this repository's
# CI, so without this a missing binary would go unnoticed. The release workflow calls it for every
# tag; run it by hand to check a release again.

on:
  workflow_call:
    inputs:
      version:
        description: The release to check, such as v0.0.1 or 0.0.1.
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: The release to check, such as v0.0.1 or 0.0.1.
        required: true

permissions:
  contents: read

env:
  # The org's universe takes the GitHub owner's name.
  UNIVERSE: https://${{ github.repository_owner }}.r-universe.dev

jobs:
  universe:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    outputs:
      package: ${{ steps.wait.outputs.package }}
      version: ${{ steps.wait.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: r/DESCRIPTION
          sparse-checkout-cone-mode: false

      - id: wait
        name: Wait for R-universe's Linux, macOS and Windows binaries
        env:
          RAW: ${{ inputs.version }}
        run: |
          version="${RAW#v}"
          package=$(sed -n 's/^Package: //p' r/DESCRIPTION)
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          url="$UNIVERSE/api/packages/$package"
          for _ in $(seq 1 120); do
            if curl -fsS "$url" | jq -e --arg v "$version" '
                .Version == $v and
                (["linux", "mac", "win"] - ([._binaries[] | select(.version == $v and .status == "success") | .os] | unique)) == []
              ' > /dev/null 2>&1; then
              curl -fsS "$url" | jq -r '._binaries[] | "\(.os) \(.distro // "") R \(.r): \(.status) \(.buildurl)"'
              exit 0
            fi
            sleep 60
          done
          echo "::error::R-universe has no Linux, macOS and Windows binaries of $package $version after two hours"
          exit 1

  r:
    name: r (${{ matrix.os }})
    needs: universe
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # R-universe builds Linux binaries for one Ubuntu release, and the Linux runner must match
        # it; the first step fails, naming both, once they differ.
        os: [ubuntu-26.04, macos-latest, windows-latest]
    env:
      PACKAGE: ${{ needs.universe.outputs.package }}
      VERSION: ${{ needs.universe.outputs.version }}
    steps:
      - name: Check R-universe built for this Linux release
        if: runner.os == 'Linux'
        run: |
          . /etc/os-release
          built=$(curl -fsS "$UNIVERSE/api/packages/$PACKAGE" | jq -r --arg v "$VERSION" '
            [._binaries[] | select(.os == "linux" and .version == $v and .status == "success") | .distro] | unique | join(", ")')
          case ", $built, " in
            *", $VERSION_CODENAME, "*) echo "R-universe built $PACKAGE $VERSION for $VERSION_CODENAME" ;;
            *)
              echo "::error::R-universe built $PACKAGE $VERSION for Linux '$built', not this runner's $VERSION_CODENAME; move this job's Linux runner to match"
              exit 1
              ;;
          esac

      # For the package's tests, run against the installed binary.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ env.VERSION }}
          persist-credentials: false

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          r-version: release

      # A researcher's machine has no Rust, and with no cargo a source build cannot succeed, so a
      # passing install below was a binary.
      - name: Remove Rust
        shell: bash
        run: |
          if command -v rustup > /dev/null; then rustup self uninstall -y; fi
          if command -v cargo; then echo "::error::cargo is still on PATH"; exit 1; fi

      - name: Install from the universe and run the package's tests
        shell: Rscript {0}
        run: |
          universe <- Sys.getenv("UNIVERSE")
          package <- Sys.getenv("PACKAGE")
          version <- Sys.getenv("VERSION")
          if (Sys.info()[["sysname"]] == "Linux") {
            # R-universe serves Linux binaries by distribution, architecture and R minor version.
            os_release <- readLines("/etc/os-release")
            codename <- gsub('"', "", sub("^VERSION_CODENAME=", "", grep("^VERSION_CODENAME=", os_release, value = TRUE)))
            minor <- sub("\\.[0-9]+$", "", as.character(getRversion()))
            bin <- function(u) sprintf("%s/bin/linux/%s-%s/%s/", u, codename, R.version$arch, minor)
            options(repos = c(universe = bin(universe), cran = bin("https://cran.r-universe.dev")))
            install.packages(c(package, "testthat"))
          } else {
            options(repos = c(universe = universe, CRAN = "https://cloud.r-project.org"))
            install.packages(c(package, "testthat"), type = "binary")
          }
          stopifnot(identical(as.character(packageVersion(package)), version))
          testthat::test_dir("r/tests/testthat", package = package, load_package = "installed", stop_on_failure = TRUE)
