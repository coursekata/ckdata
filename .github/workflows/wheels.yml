name: wheels

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64, manylinux: auto, test: true }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: auto, test: true }
          - { os: windows-latest, target: x64, test: true }
          - { os: macos-15-intel, target: x86_64, test: true }
          - { os: macos-latest, target: aarch64, test: true }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build the wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --manifest-path python/Cargo.toml
          manylinux: ${{ matrix.manylinux }}
      - name: Install the wheel and check the Arrow handoff
        if: ${{ matrix.test }}
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl polars pyarrow pandas duckdb
          python python/tests/check_probe.py
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ runner.os }}-${{ matrix.target }}
          path: dist
