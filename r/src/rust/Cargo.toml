[package]
name = 'ckspike'
publish = false
version = '0.1.0'
edition = '2021'
rust-version = '1.94'

[lib]
crate-type = [ 'rlib', 'staticlib' ]
name = 'ckspike'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
extendr-api = '0.9.0'
arrow-array = { version = '59', features = ['ffi'] }
ckcore = { git = 'https://github.com/coursekata/ckdata', branch = 'main' }

[profile.release]
lto = true
codegen-units = 1

# Its own workspace, so it builds the same inside the repository and inside a source tarball.
[workspace]
