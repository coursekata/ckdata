[package]
name = 'ckdata-r'
publish = false
license = 'MIT'
version = '0.0.1'
edition = '2024'
rust-version = '1.94.1'

[lib]
crate-type = [ 'rlib', 'staticlib' ]
name = 'ckdata_r'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
extendr-api = '0.9.0'
extendr-ffi = '0.9.0'
arrow-array = { version = '60', features = ['ffi'] }
arrow-schema = '60'
tokio = { version = '1', features = ['rt-multi-thread', 'time', 'sync'] }
# A symlink to the repository's core/, which R CMD build copies into the source tarball.
ckdata = { path = 'core' }

[profile.release]
lto = "thin"

# Its own workspace, so it builds the same inside the repository and inside a source tarball.
[workspace]
