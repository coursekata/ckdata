[package]
name = 'ckdata-r'
publish = false
version = '0.1.0'
edition = '2024'
rust-version = '1.94.1'

[lib]
crate-type = [ 'rlib', 'staticlib' ]
name = 'ckdata_r'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
extendr-api = '0.9.0'
arrow-array = { version = '59', features = ['ffi'] }
# A symlink to the repository's core/, which R CMD build copies into the source tarball.
ckdata = { path = 'core' }

[profile.release]
lto = true
codegen-units = 1

# Its own workspace, so it builds the same inside the repository and inside a source tarball.
[workspace]
